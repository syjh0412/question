<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모둠활동 타이머</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--blue:#2563eb;--amber:#b45309;--red:#dc2626}*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Helvetica Neue","Noto Sans KR",sans-serif;overflow:hidden;transition:.3s}.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:14px;padding:20px 28px}.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}.brand{font-weight:800;font-size:clamp(18px,2vw,28px);letter-spacing:-.04em}.sub{font-size:12px;color:var(--muted);margin-top:4px}.clock{justify-self:center;display:flex;gap:10px;align-items:baseline;background:#fff;border:1px solid var(--line);border-radius:15px;padding:8px 14px}.clock b{font-size:clamp(18px,2vw,28px);font-variant-numeric:tabular-nums;letter-spacing:.06em}.clock span{font-size:12px;color:var(--muted);font-weight:700}.actions{justify-self:end;display:flex;gap:8px}button,input,select{font:inherit}button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:13px;padding:10px 13px;font-weight:700;cursor:pointer}.main{display:grid;place-items:center;min-height:0}.card{width:min(1100px,95vw);min-height:min(67vh,700px);background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:32px;box-shadow:0 18px 48px rgba(15,23,42,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}.state{font-size:clamp(16px,1.8vw,24px);font-weight:800;color:var(--muted);margin-bottom:10px}.time{display:flex;align-items:baseline;justify-content:center;white-space:nowrap;font-size:clamp(105px,21vw,330px);line-height:.9;font-weight:800;font-variant-numeric:tabular-nums}.digit{letter-spacing:.10em}.colon{margin:0 .15em}.msg{min-height:38px;margin-top:22px;font-size:clamp(17px,2vw,28px);font-weight:800;color:var(--muted)}.bar{position:absolute;left:0;right:0;bottom:0;height:9px;background:#eef2f7}.fill{height:100%;width:100%;background:var(--blue);transition:width .2s linear,background .3s}.controls{display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap}.primary{background:var(--blue);border-color:var(--blue);color:#fff;min-width:150px;padding:13px 20px;font-size:17px}.quick{display:flex;gap:7px;margin-right:7px}.quick button{color:var(--muted)}body.warn{background:#fff7ed}body.warn .state,body.warn .time,body.warn .msg{color:var(--amber)}body.warn .fill{background:#f59e0b}body.danger{background:#fef2f2}body.danger .state,body.danger .time,body.danger .msg{color:var(--red)}body.danger .fill{background:#ef4444}body.done{background:#111827;color:#fff}body.done .card{background:#0f172a;border-color:#334155;box-shadow:none}body.done .state,body.done .time,body.done .msg{color:#fff}body.done .clock,body.done button{background:#1f2937;border-color:#374151;color:#fff}.backdrop{position:fixed;inset:0;background:rgba(15,23,42,.48);display:none;place-items:center;padding:18px;z-index:10}.backdrop.show{display:grid}.modal{width:min(680px,96vw);max-height:92vh;overflow:auto;background:#fff;color:#111827;border-radius:24px;padding:25px;box-shadow:0 30px 80px rgba(15,23,42,.25)}h2{margin:0 0 6px}.intro{margin:0 0 20px;color:#6b7280}.section{padding:17px 0;border-top:1px solid #eef2f7}.section:first-of-type{border-top:0}.title{font-size:14px;font-weight:900;margin-bottom:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field label{display:block;font-size:12px;font-weight:800;color:#475569;margin-bottom:7px}.field input,.field select{width:100%;padding:13px 14px;border:1px solid #dbe1e8;border-radius:13px;font-size:17px;font-weight:700;background:#fff;color:#111827}.help{font-size:12px;color:#94a3b8;line-height:1.5;margin-top:8px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.toast{position:fixed;top:25px;left:50%;transform:translate(-50%,-15px);opacity:0;background:#111827;color:#fff;border-radius:999px;padding:12px 18px;font-weight:800;transition:.25s;z-index:30;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:760px){.app{padding:13px}.top{grid-template-columns:1fr auto}.clock{grid-column:1/-1;grid-row:2;justify-self:start}.actions{grid-column:2;grid-row:1}.card{min-height:60vh}.time{font-size:clamp(85px,29vw,180px)}.quick{display:none}}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app"><header class="top"><div><div class="brand">모둠활동 타이머</div><div class="sub" id="summary"></div></div><div class="clock"><span>현재 시각</span><b id="now">--:--:--</b></div><div class="actions"><button id="setting">⚙ 설정</button><button id="full">⛶ 전체 화면</button></div></header><main class="main"><section class="card"><div class="state" id="state">준비</div><div class="time"><span class="digit" id="mm">05</span><span class="colon">:</span><span class="digit" id="ss">00</span></div><div class="msg" id="msg">시작 버튼을 누르세요</div><div class="bar"><div class="fill" id="fill"></div></div></section></main><footer class="controls"><div class="quick"><button data-t="180">3분</button><button data-t="300">5분</button><button data-t="420">7분</button><button data-t="600">10분</button></div><button class="primary" id="start">▶ 시작</button><button id="reset">↺ 처음으로</button><button id="minus">− 1분</button><button id="plus">+ 1분</button></footer></div>
<div class="backdrop" id="backdrop"><div class="modal"><h2>타이머 설정</h2><p class="intro">한 번 저장한 설정은 이 브라우저에 기억됩니다.</p><div class="section"><div class="title">① 모둠활동 시간</div><div class="grid"><div class="field"><label>분</label><input id="m" type="number" min="0" max="180"></div><div class="field"><label>초</label><input id="s" type="number" min="0" max="59"></div></div></div><div class="section"><div class="title">② 사전 알림</div><div class="grid"><div class="field"><label>몇 분 남았을 때</label><input id="am" type="number" min="0" max="180"></div><div class="field"><label>추가 초</label><input id="as" type="number" min="0" max="59"></div></div><div class="help">예: 2분 30초 전이면 2분 / 30초. 0분 0초면 사전 알림 없음.</div><button id="previewA">🔔 미리듣기</button></div><div class="section"><div class="title">③ 종료 알림</div><div class="field"><label>종료 시</label><select id="endMode"><option value="voice">“모둠활동이 종료되었습니다” 음성</option><option value="loud">큰 소리 알림</option></select></div><button id="previewE">🔊 미리듣기</button><div class="help">30초 남으면 화면이 붉은 계열로 바뀌고, 10초 이내에는 마무리 화면이 강조됩니다.</div></div><div class="modal-actions"><button id="cancel">취소</button><button class="primary" id="save">저장</button></div></div></div><div class="toast" id="toast"></div>
<script>
(()=>{const K='groupTimer_v5',D={duration:300,alert:60,end:'voice'},$=x=>document.getElementById(x);let cfg;try{cfg={...D,...JSON.parse(localStorage.getItem(K)||'{}')}}catch{cfg={...D}}let total=Math.max(1,+cfg.duration||300),left=total,run=false,endAt=0,tid=null,announced=false,audio=null,toastTid=null;const mm=$('mm'),ss=$('ss'),state=$('state'),msg=$('msg'),fill=$('fill'),start=$('start'),summary=$('summary'),backdrop=$('backdrop');const natural=n=>{n=Math.max(0,Math.round(n));let m=Math.floor(n/60),s=n%60;return m&&s?`${m}분 ${s}초`:m?`${m}분`:`${s}초`};const saveCfg=()=>localStorage.setItem(K,JSON.stringify(cfg));function show(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toastTid);toastTid=setTimeout(()=>$('toast').classList.remove('show'),2200)}function clock(){let d=new Date();$('now').textContent=new Intl.DateTimeFormat('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d)}function fmt(){let n=Math.max(0,Math.ceil(left));mm.textContent=String(Math.floor(n/60)).padStart(2,'0');ss.textContent=String(n%60).padStart(2,'0')}function updateSummary(){summary.textContent=`${String(Math.floor(total/60)).padStart(2,'0')}:${String(total%60).padStart(2,'0')} · ${cfg.alert?natural(cfg.alert)+' 전 알림':'사전 알림 없음'} · 종료: ${cfg.end==='loud'?'큰 소리':'음성'}`}function audioOn(){if(!audio)audio=new(AudioContext||webkitAudioContext)();if(audio.state==='suspended')audio.resume()}function beep(f=880,d=.14,g=.05,delay=0){try{audioOn();let o=audio.createOscillator(),v=audio.createGain(),t=audio.currentTime+delay;o.frequency.value=f;v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v);v.connect(audio.destination);o.start(t);o.stop(t+d)}catch{}}function chime(){beep(660,.16,.05,0);beep(790,.18,.05,.18);beep(990,.34,.06,.38)}function loud(){[740,980,740,980,740,1180,980,1180].forEach((f,i)=>beep(f,.2,.14,i*.23))}function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.95;u.volume=1;speechSynthesis.speak(u)}catch{}}function render(){fmt();fill.style.width=`${Math.max(0,Math.min(100,left/total*100))}%`;document.body.classList.remove('warn','danger','done');if(left<=0){document.body.classList.add('done');state.textContent='시간 종료';msg.textContent='모둠활동이 종료되었습니다';start.textContent='▶ 다시 시작';return}if(run&&left<=30){document.body.classList.add('danger');state.textContent=left<=10?'마무리':'30초 이내';msg.textContent=left<=10?'이제 정리해 주세요':'마무리할 시간입니다'}else if(run&&cfg.alert>30&&left<=cfg.alert){document.body.classList.add('warn');state.textContent=`${natural(cfg.alert)} 이내`;msg.textContent='핵심 내용을 정리해 주세요'}else if(run){state.textContent='모둠활동 진행 중';msg.textContent='함께 이야기하고 기록하세요'}else if(left<total){state.textContent='일시정지';msg.textContent='준비되면 다시 시작하세요'}else{state.textContent='준비';msg.textContent='시작 버튼을 누르세요'}}function advance(){let t=`${natural(cfg.alert)} 남았습니다`;show(t);chime();setTimeout(()=>speak(t),250)}function finish(){if(cfg.end==='loud')loud();else{chime();setTimeout(()=>speak('모둠활동이 종료되었습니다'),400)}}function tick(){if(!run)return;left=Math.max(0,Math.ceil((endAt-Date.now())/1000));if(cfg.alert>0&&cfg.alert<total&&left<=cfg.alert&&!announced){announced=true;advance()}if(left<=0){run=false;clearInterval(tid);tid=null;finish()}render()}function toggle(){audioOn();if(left<=0){left=total;announced=false}if(run){run=false;left=Math.max(0,Math.ceil((endAt-Date.now())/1000));clearInterval(tid);tid=null;start.textContent='▶ 계속';render()}else{run=true;endAt=Date.now()+left*1000;start.textContent='Ⅱ 일시정지';tid=setInterval(tick,200);tick()}}function reset(){run=false;clearInterval(tid);tid=null;left=total;announced=false;start.textContent='▶ 시작';render()}function adjust(sec){let newTotal=Math.max(60,total+sec);let delta=newTotal-total;total=newTotal;left=Math.max(0,left+delta);cfg.duration=total;saveCfg();if(run)endAt+=delta*1000;updateSummary();render();show(delta>0?'1분 추가했습니다':'1분 줄였습니다')}function setTime(sec){total=left=sec;cfg.duration=sec;saveCfg();announced=false;updateSummary();reset()}function openSettings(){$('m').value=Math.floor(total/60);$('s').value=total%60;$('am').value=Math.floor(cfg.alert/60);$('as').value=cfg.alert%60;$('endMode').value=cfg.end;backdrop.classList.add('show')}function saveSettings(){let t=Math.max(1,(+$('m').value||0)*60+(+$('s').value||0));cfg.alert=Math.max(0,(+$('am').value||0)*60+(+$('as').value||0));cfg.end=$('endMode').value==='loud'?'loud':'voice';total=left=t;cfg.duration=t;saveCfg();announced=false;backdrop.classList.remove('show');updateSummary();reset();show('설정을 저장했습니다')}$('start').onclick=toggle;$('reset').onclick=reset;$('plus').onclick=()=>adjust(60);$('minus').onclick=()=>adjust(-60);$('setting').onclick=openSettings;$('cancel').onclick=()=>backdrop.classList.remove('show');$('save').onclick=saveSettings;$('previewA').onclick=()=>{let a=Math.max(0,(+$('am').value||0)*60+(+$('as').value||0));if(!a)return show('사전 알림이 꺼져 있습니다');chime();setTimeout(()=>speak(`${natural(a)} 남았습니다`),250)};$('previewE').onclick=()=>{$('endMode').value==='loud'?loud():(chime(),setTimeout(()=>speak('모둠활동이 종료되었습니다'),400))};$('full').onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch{}};document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>setTime(+b.dataset.t));document.addEventListener('keydown',e=>{if(backdrop.classList.contains('show'))return;if(e.code==='Space'){e.preventDefault();toggle()}else if(e.key.toLowerCase()==='r')reset();else if(e.key.toLowerCase()==='f')$('full').click()});clock();setInterval(clock,1000);updateSummary();render()})();
</script></body></html>
