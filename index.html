<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>힘 탐정 사무소 · 미해결 사건 게시판</title>
<style>
  :root{
    --ink:#16243a; --ink-2:#2c3e57; --soft:#65788e;
    --hair:#d6dde5; --bg:#f2f5f8; --card:#fff;
    --accent:#c8781f; --accent-soft:#fdf3e6;
    --water:#2b6ea3; --water-soft:#e8f3fb;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6;font-size:16px;padding-bottom:40px;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 14px;}
  .narrow{max-width:560px;margin:0 auto;}

  header{background:var(--ink);color:#fff;padding:16px 0 14px;margin-bottom:16px;}
  header .wrap{display:flex;align-items:center;gap:10px;}
  header h1{font-size:18px;font-weight:800;letter-spacing:-.02em;line-height:1.2;}
  header p{font-size:11.5px;color:#9fb0c4;letter-spacing:.08em;margin-top:3px;}
  header .who{margin-left:auto;font-size:12px;color:#9fb0c4;text-align:right;}
  header .who b{display:block;color:#fff;font-size:13.5px;font-weight:700;}

  .card{background:var(--card);border:1px solid var(--hair);border-radius:10px;
    padding:18px 16px;margin-bottom:14px;}
  .card > h2{font-size:15px;font-weight:800;margin-bottom:4px;letter-spacing:-.01em;}
  .card > h2 + .sub{font-size:12.5px;color:var(--soft);margin-bottom:14px;}

  label{display:block;font-size:12.5px;font-weight:700;color:var(--soft);margin:12px 0 5px;}
  input[type=text],input[type=number],select,textarea{width:100%;font:inherit;font-size:16px;
    color:var(--ink);background:#fff;border:1.5px solid var(--hair);border-radius:8px;padding:11px 12px;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink-2);}
  textarea{min-height:92px;resize:vertical;line-height:1.5;}
  .row{display:flex;gap:8px;} .row>div{flex:1;}

  button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:8px;
    padding:13px 16px;font-size:15.5px;}
  .primary{background:var(--ink);color:#fff;width:100%;}
  .primary:disabled{background:#9aa8b8;}
  .ghost{background:#fff;border:1.5px solid var(--hair);color:var(--ink-2);}

  .seg{display:flex;gap:8px;margin-top:6px;}
  .seg button{flex:1;background:#fff;border:1.5px solid var(--hair);color:var(--soft);
    font-size:14px;padding:11px 8px;}
  .seg button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}

  .check{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px;color:var(--ink-2);}
  .check input{width:18px;height:18px;accent-color:var(--ink);}

  .tabs{display:flex;gap:7px;margin-bottom:14px;}
  .tabs button{flex:1;background:#fff;border:1.5px solid var(--hair);color:var(--soft);
    padding:11px 6px;font-size:14px;}
  .tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff;}

  .q{border:1px solid var(--hair);border-radius:10px;background:#fff;padding:14px;
    margin-bottom:10px;}
  .q .meta{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--soft);
    margin-bottom:7px;flex-wrap:wrap;}
  .q .tag{background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:2px 9px;font-weight:700;}
  .q .tag.close{background:#eef2f6;color:var(--soft);}
  .q .who{margin-left:auto;}
  .q > p{font-size:15.5px;line-height:1.55;}

  .foot{display:flex;align-items:center;gap:7px;margin-top:11px;padding-top:10px;
    border-top:1px dashed var(--hair);}
  .foot button{background:#fff;border:1.5px solid var(--hair);color:var(--soft);
    font-size:13px;font-weight:700;padding:6px 12px;border-radius:20px;}
  .foot button.water.on{background:var(--water-soft);border-color:#5a9ad1;color:var(--water);}
  .foot .n{font-size:12.5px;color:var(--soft);margin-left:auto;}

  .alist{margin-top:10px;}
  .ans{background:#f7f9fb;border-left:3px solid var(--hair);border-radius:0 6px 6px 0;
    padding:8px 11px;margin-bottom:6px;}
  .ans .n{font-size:11.5px;color:var(--soft);font-weight:700;margin-bottom:1px;}
  .ans p{font-size:14.5px;line-height:1.5;}
  .ansbox{display:none;gap:7px;margin-top:9px;}
  .ansbox.open{display:flex;}
  .ansbox textarea{min-height:44px;font-size:15px;padding:9px 10px;}
  .ansbox button{flex-shrink:0;background:var(--ink);color:#fff;padding:0 16px;font-size:14px;}

  .grid{display:grid;grid-template-columns:1fr;gap:0 12px;align-items:start;}
  @media(min-width:680px){ .grid{grid-template-columns:1fr 1fr;} }
  @media(min-width:980px){ .grid{grid-template-columns:1fr 1fr 1fr;} }

  .board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch;}
  .col{flex:0 0 290px;min-width:290px;}
  .col h3{font-size:13px;font-weight:800;color:var(--ink-2);background:#e6ecf2;
    border-radius:8px;padding:8px 10px;margin-bottom:10px;}
  .col h3 span{float:right;color:var(--soft);font-weight:700;}

  .mat{border:1px solid var(--hair);border-radius:10px;background:#fff;padding:14px;margin-bottom:10px;}
  .mat h3{font-size:15.5px;font-weight:800;margin-bottom:9px;}
  .mat h3 em{font-style:normal;color:var(--accent);margin-right:6px;}
  .mat .btns{display:flex;gap:7px;flex-wrap:wrap;}
  .mat a, .mat button.vid{display:inline-block;text-decoration:none;font-size:13.5px;
    font-weight:700;padding:8px 14px;border-radius:20px;border:1.5px solid var(--hair);
    color:var(--ink-2);background:#fff;}
  .mat a.snorkl{background:var(--accent);border-color:var(--accent);color:#fff;}
  .vidbox{display:none;margin-top:11px;}
  .vidbox.open{display:block;}
  .vidbox iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:8px;}

  .empty{text-align:center;color:var(--soft);font-size:14px;padding:30px 10px;}
  .msg{border-radius:8px;padding:12px 14px;font-size:14px;margin-bottom:12px;display:none;}
  .msg.err{background:#fdecea;color:#a8322a;display:block;}
  .msg.ok{background:#e9f5ee;color:#1f7a4d;display:block;}

  details{margin-top:14px;border-top:1px dashed var(--hair);padding-top:12px;}
  summary{font-size:13.5px;color:var(--accent);font-weight:700;cursor:pointer;list-style:none;}
  summary::-webkit-details-marker{display:none;}
  details ul{margin-top:10px;list-style:none;}
  details li{font-size:13.5px;color:var(--ink-2);padding:6px 0 6px 12px;
    border-left:2px solid var(--hair);margin-bottom:4px;}

  .bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
  .bar select{width:auto;flex:1;min-width:150px;padding:9px 10px;font-size:14.5px;}
  .bar button{padding:9px 14px;font-size:14px;}
  .count{font-size:12.5px;color:var(--soft);margin-bottom:10px;}
  .tabs button#tabTeach{flex:0 0 46px;font-size:15px;}
  table.st{width:100%;border-collapse:collapse;background:#fff;font-size:14px;}
  table.st th,table.st td{border:1px solid var(--hair);padding:7px 8px;text-align:center;}
  table.st th{background:#eef2f6;font-size:12.5px;color:var(--ink-2);}
  table.st td.l{text-align:left;}
  .del{background:#fff;border:1.5px solid #e6c9c5;color:#a8322a;font-size:12px;
    font-weight:700;padding:4px 10px;border-radius:20px;}
  h3.lhead{font-size:14px;font-weight:800;color:#fff;background:var(--ink-2);
    border-radius:8px;padding:8px 12px;margin:20px 0 10px;}
  h3.lhead span{float:right;font-weight:700;color:#b9c8d8;font-size:12.5px;}
  .tq{border:1px solid var(--hair);border-radius:10px;background:#fff;padding:13px;margin-bottom:9px;}
  .tq .m{font-size:11.5px;color:var(--soft);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:5px;}
  .tq .m .an{background:#fdecea;color:#a8322a;border-radius:20px;padding:1px 8px;font-weight:700;}
  .tq p{font-size:15px;line-height:1.5;}
  .tq .ta{background:#f7f9fb;border-left:3px solid var(--hair);padding:6px 10px;
    margin-top:6px;font-size:13.5px;display:flex;gap:8px;align-items:flex-start;}
  .tq .ta b{font-weight:700;color:var(--soft);font-size:11.5px;flex-shrink:0;}
  .tq .ta span{flex:1;}
  @media print{
    header,.tabs,.noprint,.del{display:none !important;}
    body{background:#fff;} .wrap{max-width:100%;}
    .tq{break-inside:avoid;}
  }

  .hide{display:none;}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#fff" stroke-width="1.8">
      <circle cx="10.5" cy="10.5" r="6.6"/>
      <path d="M15.4 15.4 L22 22" stroke-linecap="round" stroke-width="2.4"/>
    </svg>
    <div>
      <h1>미해결 사건 게시판</h1>
      <p>힘 탐정 사무소</p>
    </div>
    <div class="who hide" id="who"></div>
  </div>
</header>

<div class="wrap">

  <section id="login" class="narrow">
    <div class="card">
      <h2>탐정 확인</h2>
      <div class="sub">반, 번호, 이름을 적고 들어오세요.</div>
      <div class="msg" id="loginMsg"></div>
      <div class="row">
        <div><label>반</label><input type="number" id="inCls" inputmode="numeric" placeholder="1"></div>
        <div><label>번호</label><input type="number" id="inNum" inputmode="numeric" placeholder="7"></div>
      </div>
      <label>이름</label>
      <input type="text" id="inName" placeholder="홍길동">
      <div style="height:18px"></div>
      <button class="primary" id="btnLogin">들어가기</button>
    </div>
  </section>

  <section id="main" class="hide">
    <div class="tabs narrow">
      <button id="tabMat">차시 자료</button>
      <button id="tabWrite" class="on">사건 접수</button>
      <button id="tabList">우리 반 사건</button>
      <button id="tabTeach" title="교사용">🔒</button>
    </div>

    <div id="paneMat" class="hide narrow">
      <div id="matList"><div class="empty">불러오는 중...</div></div>
    </div>

    <div id="paneWrite" class="narrow">
      <div class="card">
        <h2>궁금한 것을 적으세요</h2>
        <div class="sub">답을 모르는 질문일수록 좋은 사건입니다.</div>
        <div class="msg" id="writeMsg"></div>

        <label>몇 차시 질문인가요?</label>
        <select id="inLesson"></select>

        <label>언제 생긴 궁금증인가요?</label>
        <div class="seg">
          <button class="on" data-stage="열기">수업 전 · 열기</button>
          <button data-stage="닫기">수업 후 · 닫기</button>
        </div>

        <label>질문</label>
        <textarea id="inText" placeholder="예) 용수철을 계속 당기면 계속 세지기만 할까?"></textarea>

        <div class="check">
          <input type="checkbox" id="inAnon">
          <label for="inAnon" style="margin:0;font-weight:600;color:var(--ink-2);font-size:14px;">이름을 숨기고 올리기</label>
        </div>

        <div style="height:16px"></div>
        <button class="primary" id="btnSend">사건 접수하기</button>

        <details>
          <summary>질문이 잘 안 떠올라요</summary>
          <ul id="hints"></ul>
        </details>
      </div>
    </div>

    <div id="paneTeach" class="hide">
      <div id="pinBox" class="narrow">
        <div class="card">
          <h2>교사 확인</h2>
          <div class="sub">비밀번호를 입력하세요.</div>
          <div class="msg" id="pinMsg"></div>
          <input type="password" id="inPin" inputmode="numeric" placeholder="••••">
          <div style="height:14px"></div>
          <button class="primary" id="btnPin">들어가기</button>
        </div>
      </div>

      <div id="teachMain" class="hide">
        <div class="bar noprint">
          <select id="tCls">
            <option value="">전체 반</option>
            <option value="1">1반</option><option value="2">2반</option>
            <option value="3">3반</option><option value="4">4반</option>
            <option value="5">5반</option><option value="6">6반</option>
          </select>
          <select id="tLesson"></select>
          <select id="tView">
            <option value="q">질문 보기</option>
            <option value="s">참여 집계</option>
          </select>
          <button class="ghost" id="tReload">새로 불러오기</button>
          <button class="ghost" id="tPrint">인쇄</button>
        </div>
        <div id="tBody"></div>
      </div>
    </div>

    <div id="paneList" class="hide">
      <div class="bar">
        <select id="filterLesson"></select>
        <select id="sortBy">
          <option value="new">최신순</option>
          <option value="water">물 많은 순</option>
        </select>
        <button class="ghost" id="btnReload">새로 불러오기</button>
      </div>
      <div class="count" id="count"></div>
      <div id="list"></div>
    </div>
  </section>

</div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbyZreV328my-iKBMxjIC8wYk7nEWtyvttORGTIdsY0pp_UG94UPC--RGn-c09dKgb4m/exec';

var LESSONS = [
  {n:1,t:'힘의 표현'}, {n:2,t:'알짜힘'}, {n:3,t:'중력'}, {n:4,t:'탄성력'},
  {n:5,t:'마찰력'}, {n:6,t:'부력'}, {n:7,t:'힘과 운동'}, {n:8,t:'여러 가지 힘의 이용'}
];

var HINTS = {
  1:['이 힘은 어디에서 시작될까?','화살표 길이를 무엇으로 정할까?'],
  2:['움직이는 물체도 알짜힘이 0일 수 있을까?','두 힘이 비스듬하면 어떻게 될까?'],
  3:['달에서도 똑같을까?','중력을 약하게 만들 수 있을까?'],
  4:['얼마나 늘이면 원래대로 안 돌아올까?','고무줄도 용수철과 똑같을까?'],
  5:['젖으면 마찰력은 어떻게 될까?','얼마나 거칠어야 충분할까?'],
  6:['더 깊이 넣으면 부력이 더 커질까?','소금물에서는 어떻게 될까?'],
  7:['방향만 바뀌는 경우는 언제일까?','속력과 방향이 같이 바뀌는 예는?'],
  8:['이 장치는 어떤 힘을 이용했을까?','우리 학교에서 고칠 곳은 어디일까?']
};

var me = null, stage = '열기';
var QS = [], loadSeq = 0;

function $(id){ return document.getElementById(id); }
function show(el,on){ el.classList.toggle('hide', !on); }
function msg(el,t,k){ el.className='msg '+(k||''); el.textContent=t||''; if(!t) el.style.display='none'; }
function title(n){ var L=LESSONS.filter(function(x){return String(x.n)===String(n);})[0]; return L?L.t:''; }

var seq = 0;
function call(params, done, fail){
  var cb='cb_'+(++seq)+'_'+Date.now(), s;
  var timer=setTimeout(function(){ clean(); if(fail) fail('시간이 초과되었습니다'); },15000);
  function clean(){ clearTimeout(timer); try{delete window[cb];}catch(e){window[cb]=undefined;}
    if(s&&s.parentNode) s.parentNode.removeChild(s); }
  window[cb]=function(res){ clean(); if(res&&res.ok) done(res); else if(fail) fail((res&&res.error)||'오류'); };
  var q=['callback='+cb];
  for(var k in params){ if(params[k]==null) continue;
    q.push(encodeURIComponent(k)+'='+encodeURIComponent(params[k])); }
  s=document.createElement('script');
  s.src=API+'?'+q.join('&');
  s.onerror=function(){ clean(); if(fail) fail('연결에 실패했습니다'); };
  document.head.appendChild(s);
}

(function(){
  var sel=$('inLesson'), fil=$('filterLesson');
  LESSONS.forEach(function(L){
    var o=document.createElement('option');
    o.value=L.n; o.textContent=L.n+'차시 · '+L.t;
    sel.appendChild(o); fil.appendChild(o.cloneNode(true));
  });
  var all=document.createElement('option');
  all.value=''; all.textContent='전체 보기 (차시별 정리)';
  fil.insertBefore(all, fil.firstChild);
  fil.value='';
  sel.addEventListener('change', drawHints);
  drawHints();
})();

function drawHints(){
  var ul=$('hints'); ul.innerHTML='';
  (HINTS[$('inLesson').value]||[]).forEach(function(t){
    var li=document.createElement('li'); li.textContent=t; ul.appendChild(li);
  });
  var li=document.createElement('li');
  li.textContent='그대로 베끼지 말고, 내 말로 바꿔 보세요.';
  li.style.color='var(--soft)'; li.style.borderLeftColor='transparent';
  ul.appendChild(li);
}

$('btnLogin').addEventListener('click', function(){
  var c=$('inCls').value.trim(), n=$('inNum').value.trim(), nm=$('inName').value.trim();
  if(!c||!n||!nm){ msg($('loginMsg'),'반, 번호, 이름을 모두 적어주세요.','err'); return; }
  me={cls:c,num:n,name:nm};
  $('who').innerHTML='<b>'+nm+'</b>'+c+'반 '+n+'번';
  show($('who'),true); show($('login'),false); show($('main'),true);
  window.scrollTo(0,0);
});

function tab(which){
  ['Mat','Write','List','Teach'].forEach(function(k){
    $('tab'+k).classList.toggle('on', k===which);
    show($('pane'+k), k===which);
  });
  if(which==='Mat') loadMat();
  if(which==='List') load();
}
$('tabMat').addEventListener('click',function(){ tab('Mat'); });
$('tabWrite').addEventListener('click',function(){ tab('Write'); });
$('tabList').addEventListener('click',function(){ tab('List'); });

Array.prototype.forEach.call(document.querySelectorAll('.seg button'),function(b){
  b.addEventListener('click',function(){
    Array.prototype.forEach.call(document.querySelectorAll('.seg button'),function(x){x.classList.remove('on');});
    b.classList.add('on'); stage=b.dataset.stage;
  });
});

$('btnSend').addEventListener('click', function(){
  var text=$('inText').value.trim();
  if(text.length<5){ msg($('writeMsg'),'질문을 조금 더 자세히 적어주세요.','err'); return; }
  var btn=this; btn.disabled=true; btn.textContent='접수하는 중...'; msg($('writeMsg'),'');
  call({action:'add',lesson:$('inLesson').value,cls:me.cls,num:me.num,name:me.name,
        stage:stage,text:text,anon:$('inAnon').checked?'1':'0'},
    function(){ btn.disabled=false; btn.textContent='사건 접수하기'; $('inText').value='';
      msg($('writeMsg'),'접수되었습니다. 사건 목록에서 확인할 수 있어요.','ok'); },
    function(err){ btn.disabled=false; btn.textContent='사건 접수하기';
      msg($('writeMsg'),'보내지 못했습니다. '+err,'err'); });
});

$('btnReload').addEventListener('click', load);
$('filterLesson').addEventListener('change', load);
$('sortBy').addEventListener('change', render);

function load(){
  var box=$('list');
  box.innerHTML='<div class="empty">불러오는 중...</div>';
  $('count').textContent='';
  var my = ++loadSeq;

  call({action:'feed',cls:me.cls,num:me.num,lesson:$('filterLesson').value||''}, function(res){
    if(my !== loadSeq) return;
    QS = res.items || [];
    render();
  }, function(err){
    if(my !== loadSeq) return;
    box.innerHTML='<div class="empty">불러오지 못했습니다.<br>'+err+'</div>';
  });
}

function sortList(arr){
  var a=arr.slice();
  if($('sortBy').value==='water') a.sort(function(x,y){ return (y.water||0)-(x.water||0); });
  return a;
}

function render(){
  var box=$('list');
  if(!QS.length){ box.innerHTML='<div class="empty">아직 접수된 사건이 없습니다.</div>'; return; }
  $('count').textContent=me.cls+'반 · 사건 '+QS.length+'건';
  box.innerHTML='';

  if($('filterLesson').value===''){
    var board=document.createElement('div'); board.className='board';
    LESSONS.forEach(function(L){
      var items=sortList(QS.filter(function(q){ return String(q.lesson)===String(L.n); }));
      if(!items.length) return;
      var col=document.createElement('div'); col.className='col';
      var h=document.createElement('h3');
      h.innerHTML=L.n+'차시 · '+L.t+'<span>'+items.length+'</span>';
      col.appendChild(h);
      items.forEach(function(q){ col.appendChild(card(q)); });
      board.appendChild(col);
    });
    box.appendChild(board);
  } else {
    var g=document.createElement('div'); g.className='grid';
    sortList(QS).forEach(function(q){ g.appendChild(card(q)); });
    box.appendChild(g);
  }
}

function card(it){
  var d=document.createElement('div');
  d.className='q'; d.dataset.qid=it.id;

  var meta=document.createElement('div');
  meta.className='meta';
  meta.innerHTML='<span class="tag'+(it.stage==='닫기'?' close':'')+'">'+it.stage+'</span>'+
    '<span>'+it.lesson+'차시 · '+title(it.lesson)+'</span>'+
    '<span class="who">'+(it.anon?'익명':(it.num+'번 '+it.name))+'</span>';

  var p=document.createElement('p');
  p.textContent=it.text;

  var foot=document.createElement('div'); foot.className='foot';
  var bw=document.createElement('button');
  bw.className='water';
  bw.innerHTML='물 주기 <span>'+(it.water||0)+'</span>';
  if(it.mine){ bw.classList.add('on'); bw.disabled=true; }
  bw.addEventListener('click',function(){ water(it.id,bw); });
  var ba=document.createElement('button'); ba.textContent='답 달기';
  var cnt=document.createElement('span'); cnt.className='n';
  foot.appendChild(bw); foot.appendChild(ba); foot.appendChild(cnt);

  var alist=document.createElement('div'); alist.className='alist';
  var arr=it.answers||[];
  arr.forEach(function(a){ alist.appendChild(ansEl(a)); });
  if(arr.length) cnt.textContent='답변 '+arr.length+'개';

  var box=document.createElement('div'); box.className='ansbox';
  var ta=document.createElement('textarea'); ta.placeholder='내가 아는 만큼 답해 보세요';
  var bs=document.createElement('button'); bs.textContent='올리기';
  bs.addEventListener('click',function(){ answer(it.id,ta,bs,alist,cnt); });
  box.appendChild(ta); box.appendChild(bs);

  ba.addEventListener('click',function(){
    box.classList.toggle('open');
    ba.textContent=box.classList.contains('open')?'취소':'답 달기';
    if(box.classList.contains('open')) ta.focus();
  });

  d.appendChild(meta); d.appendChild(p); d.appendChild(foot);
  d.appendChild(alist); d.appendChild(box);
  return d;
}

function ansEl(a){
  var e=document.createElement('div'); e.className='ans';
  var n=document.createElement('div'); n.className='n'; n.textContent=a.num+'번 '+a.name;
  var p=document.createElement('p'); p.textContent=a.text;
  e.appendChild(n); e.appendChild(p); return e;
}

function water(qid,btn){
  if(btn.disabled) return;
  btn.disabled=true;
  call({action:'water',qid:qid,cls:me.cls,num:me.num}, function(){
    var sp=btn.querySelector('span');
    sp.textContent=(Number(sp.textContent)||0)+1;
    btn.classList.add('on');
  }, function(err){ btn.disabled=false; alert(err); });
}

function answer(qid,ta,btn,alist,cnt){
  var t=ta.value.trim();
  if(t.length<2){ ta.focus(); return; }
  btn.disabled=true; btn.textContent='...';
  call({action:'answer',qid:qid,cls:me.cls,num:me.num,name:me.name,text:t}, function(){
    btn.disabled=false; btn.textContent='올리기'; ta.value='';
    alist.appendChild(ansEl({num:me.num,name:me.name,text:t}));
    cnt.textContent='답변 '+alist.children.length+'개';
  }, function(err){ btn.disabled=false; btn.textContent='올리기'; alert('올리지 못했습니다. '+err); });
}

/* ───── 교사 ───── */
var PIN = '';

$('tabTeach').addEventListener('click',function(){ tab('Teach'); });

$('btnPin').addEventListener('click', function(){
  var v=$('inPin').value.trim();
  if(!v){ msg($('pinMsg'),'비밀번호를 입력하세요.','err'); return; }
  PIN=v;
  call({action:'stats',pin:PIN,cls:''}, function(){
    show($('pinBox'),false); show($('teachMain'),true);
    tLoad();
  }, function(err){ msg($('pinMsg'),err,'err'); PIN=''; });
});

(function(){
  var sel=$('tLesson');
  var all=document.createElement('option');
  all.value=''; all.textContent='전체 차시';
  sel.appendChild(all);
  LESSONS.forEach(function(L){
    var o=document.createElement('option');
    o.value=L.n; o.textContent=L.n+'차시 · '+L.t;
    sel.appendChild(o);
  });
})();

$('tReload').addEventListener('click', tLoad);
$('tCls').addEventListener('change', tLoad);
$('tLesson').addEventListener('change', tLoad);
$('tView').addEventListener('change', tLoad);
$('tPrint').addEventListener('click', function(){ window.print(); });

function tLoad(){
  var box=$('tBody');
  box.innerHTML='<div class="empty">불러오는 중...</div>';
  if($('tView').value==='s'){
    call({action:'stats',pin:PIN,cls:$('tCls').value}, function(res){
      drawStats(res.items||[]);
    }, function(err){ box.innerHTML='<div class="empty">'+err+'</div>'; });
  } else {
    call({action:'teacher',pin:PIN,cls:$('tCls').value,lesson:$('tLesson').value}, function(res){
      drawTQ(res.items||[]);
    }, function(err){ box.innerHTML='<div class="empty">'+err+'</div>'; });
  }
}

function drawTQ(items){
  var box=$('tBody'); box.innerHTML='';
  if(!items.length){ box.innerHTML='<div class="empty">질문이 없습니다.</div>'; return; }

  var head=document.createElement('div');
  head.className='count';
  head.textContent='질문 '+items.length+'건';
  box.appendChild(head);

  if($('tLesson').value){
    items.forEach(function(it){ box.appendChild(tCard(it)); });
    return;
  }

  LESSONS.forEach(function(L){
    var arr=items.filter(function(x){ return String(x.lesson)===String(L.n); });
    if(!arr.length) return;
    var h3=document.createElement('h3');
    h3.className='lhead';
    h3.innerHTML=L.n+'차시 · '+L.t+'<span>'+arr.length+'건</span>';
    box.appendChild(h3);
    arr.forEach(function(it){ box.appendChild(tCard(it)); });
  });
}

function tCard(it){
  var d=document.createElement('div'); d.className='tq';
  var m=document.createElement('div'); m.className='m';
  m.innerHTML='<span>'+it.cls+'반 '+it.num+'번 '+it.name+'</span>'+
    (it.anon?'<span class="an">익명</span>':'')+
    '<span>'+it.stage+'</span>'+
    '<span>💧 '+(it.water||0)+'</span>';

  var del=document.createElement('button');
  del.className='del'; del.textContent='삭제';
  del.style.marginLeft='auto';
  del.addEventListener('click',function(){
    if(!confirm('이 질문과 답변을 모두 지울까요?')) return;
    call({action:'delq',pin:PIN,qid:it.id}, function(){ d.remove(); },
      function(err){ alert(err); });
  });
  m.appendChild(del);

  var p=document.createElement('p'); p.textContent=it.text;
  d.appendChild(m); d.appendChild(p);

  (it.answers||[]).forEach(function(a){
    var e=document.createElement('div'); e.className='ta';
    var b=document.createElement('b'); b.textContent=a.cls+'-'+a.num+' '+a.name;
    var sp=document.createElement('span'); sp.textContent=a.text;
    var db=document.createElement('button');
    db.className='del'; db.textContent='×';
    db.addEventListener('click',function(){
      if(!confirm('이 답변을 지울까요?')) return;
      call({action:'dela',pin:PIN,aid:a.id}, function(){ e.remove(); },
        function(err){ alert(err); });
    });
    e.appendChild(b); e.appendChild(sp); e.appendChild(db);
    d.appendChild(e);
  });
  return d;
}

function drawStats(items){
  var box=$('tBody'); box.innerHTML='';
  if(!items.length){ box.innerHTML='<div class="empty">기록이 없습니다.</div>'; return; }
  var t=document.createElement('table'); t.className='st';
  t.innerHTML='<tr><th>반</th><th>번호</th><th>이름</th><th>질문</th><th>답변</th>'+
    '<th>받은 물</th><th>준 물</th></tr>';
  items.forEach(function(s){
    var tr=document.createElement('tr');
    tr.innerHTML='<td>'+s.cls+'</td><td>'+s.num+'</td><td class="l">'+(s.name||'')+'</td>'+
      '<td>'+s.q+'</td><td>'+s.a+'</td><td>'+s.got+'</td><td>'+s.gave+'</td>';
    if(s.q===0||s.a===0) tr.style.background='#fdf6f5';
    t.appendChild(tr);
  });
  box.appendChild(t);
  var note=document.createElement('div');
  note.className='count';
  note.style.marginTop='10px';
  note.textContent='분홍색 줄은 질문이나 답변이 하나도 없는 학생입니다.';
  box.appendChild(note);
}

function loadMat(){
  var box=$('matList');
  box.innerHTML='<div class="empty">불러오는 중...</div>';
  call({action:'materials',cls:me.cls}, function(res){
    var items=res.items||[];
    if(!items.length){ box.innerHTML='<div class="empty">아직 올라온 자료가 없습니다.</div>'; return; }
    box.innerHTML='';
    items.forEach(function(m){ box.appendChild(matCard(m)); });
  }, function(err){
    box.innerHTML='<div class="empty">불러오지 못했습니다.<br>'+err+'</div>';
  });
}

function matCard(m){
  var d=document.createElement('div'); d.className='mat';
  var h=document.createElement('h3');
  h.innerHTML='<em>'+m.lesson+'차시</em>'+(m.title||title(m.lesson));
  d.appendChild(h);

  var btns=document.createElement('div'); btns.className='btns';

  if(m.pdf){
    var a=document.createElement('a');
    a.href=m.pdf; a.target='_blank'; a.rel='noopener';
    a.textContent='수업 자료 보기';
    btns.appendChild(a);
  }

  var vbox=null;
  if(m.video){
    var bv=document.createElement('button'); bv.className='vid'; bv.textContent='영상 보기';
    vbox=document.createElement('div'); vbox.className='vidbox';
    bv.addEventListener('click',function(){
      if(!vbox.firstChild){
        var f=document.createElement('iframe');
        f.src=ytEmbed(m.video);
        f.allow='accelerometer; encrypted-media; picture-in-picture';
        f.allowFullscreen=true;
        vbox.appendChild(f);
      }
      vbox.classList.toggle('open');
      bv.textContent=vbox.classList.contains('open')?'영상 접기':'영상 보기';
    });
    btns.appendChild(bv);
  }

  if(m.snorkl){
    var s=document.createElement('a');
    s.href=m.snorkl; s.target='_blank'; s.rel='noopener';
    s.className='snorkl'; s.textContent='스노클 풀기';
    btns.appendChild(s);
  }

  d.appendChild(btns);
  if(vbox) d.appendChild(vbox);
  return d;
}

function ytEmbed(url){
  var m1=url.match(/[?&]v=([\w-]{6,})/);
  var m2=url.match(/youtu\.be\/([\w-]{6,})/);
  var m3=url.match(/embed\/([\w-]{6,})/);
  var m4=url.match(/shorts\/([\w-]{6,})/);
  var id=(m1&&m1[1])||(m2&&m2[1])||(m3&&m3[1])||(m4&&m4[1])||'';
  return id ? 'https://www.youtube.com/embed/'+id : url;
}
